<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практика ИБС</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>
    <div id="app">
        <header>
            <div class="header-left">
                <h1>Практика ИБС</h1>
                <span id="online-dot" class="online-dot" style="display:none"></span>
            </div>
            <nav id="nav">
                <button id="nav-lang">EN</button>
                <button id="nav-tasks" style="display:none">Задачи</button>
                <button id="nav-profile" style="display:none">Профиль</button>
                <button id="nav-admin" style="display:none">Админ</button>
                <button id="nav-api" style="display:none">API Docs</button>
                <button id="nav-logout" style="display:none">Выйти</button>
            </nav>
        </header>

        <main>
            <section id="page-auth">
                <div class="auth-form">
                    <h2 id="auth-title">Вход</h2>
                    <form id="auth-form">
                        <input type="hidden" id="auth-mode" value="login">
                        <input type="text" id="auth-username" placeholder="Логин" required>
                        <input type="email" id="auth-email" placeholder="Почта" style="display:none">
                        <input type="password" id="auth-password" placeholder="Пароль" required>
                        <button type="submit" id="auth-submit">Войти</button>
                    </form>
                    <p>
                        <a href="#" id="auth-toggle">Зарегистрироваться</a>
                    </p>
                    <p id="auth-error" class="error"></p>
                </div>
            </section>

            <section id="page-tasks" style="display:none">
                <div class="tasks-header">
                    <h2>Мои задачи</h2>
                    <div id="task-progress" class="task-progress">
                        <span id="progress-text">0 / 0</span>
                        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
                    </div>
                </div>
                <form id="task-form">
                    <input type="text" id="task-title" placeholder="Название задачи" required>
                    <input type="text" id="task-desc" placeholder="Описание">
                    <button type="submit">Добавить</button>
                    <p id="task-error" class="error"></p>
                </form>
                <ul id="task-list"></ul>
                <div id="empty-state" class="empty-state" style="display:none">
                    <svg viewBox="0 0 80 80" fill="none">
                        <rect x="10" y="18" width="60" height="50" rx="8" stroke="currentColor" stroke-width="2" fill="none"/>
                        <line x1="20" y1="32" x2="60" y2="32" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <line x1="20" y1="42" x2="50" y2="42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <line x1="20" y1="52" x2="44" y2="52" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="64" cy="56" r="14" fill="var(--surface)" stroke="currentColor" stroke-width="2"/>
                        <line x1="64" y1="50" x2="64" y2="62" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <line x1="58" y1="56" x2="70" y2="56" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <h3 id="empty-title">Задач пока нет</h3>
                    <p id="empty-desc">Создайте первую задачу прямо сейчас!</p>
                </div>
            </section>

            <section id="page-profile" style="display:none">
                <h2>Настройки профиля</h2>
                <form id="profile-form">
                    <input type="email" id="profile-email" placeholder="Новая почта (оставьте пустым)">
                    <input type="password" id="profile-old-pw" placeholder="Текущий пароль">
                    <input type="password" id="profile-new-pw" placeholder="Новый пароль (оставьте пустым)">
                    <button type="submit">Сохранить</button>
                    <p id="profile-error" class="error"></p>
                </form>
            </section>

            <section id="page-admin" style="display:none">
                <h2>Панель администратора</h2>
                <table id="admin-table">
                    <thead><tr><th>ID</th><th>Логин</th><th>Почта</th><th>Роль</th><th>Вход</th><th>Статус</th><th>Действия</th></tr></thead>
                    <tbody id="admin-body"></tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="/static/app.js?v=4"></script>
</body>
</html>
