<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практика ИБС</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Практика ИБС</h1>
            <nav id="nav">
                <button onclick="showPage('tasks')" id="nav-tasks" style="display:none">Tasks</button>
                <button onclick="showPage('admin')" id="nav-admin" style="display:none">Admin</button>
                <button onclick="window.open('/docs', '_blank')" id="nav-api" style="display:none">API Docs</button>
                <button onclick="logout()" id="nav-logout" style="display:none">Logout</button>
            </nav>
        </header>

        <main>
            <section id="page-auth">
                <div class="auth-form">
                    <h2 id="auth-title">Login</h2>
                    <form id="auth-form" onsubmit="return handleAuth(event)">
                        <input type="hidden" id="auth-mode" value="login">
                        <input type="text" id="auth-username" placeholder="Username" required>
                        <input type="email" id="auth-email" placeholder="Email (for register)" style="display:none">
                        <input type="password" id="auth-password" placeholder="Password" required>
                        <button type="submit" id="auth-submit">Login</button>
                    </form>
                    <p>
                        <a href="#" onclick="toggleAuth()" id="auth-toggle">Register instead</a>
                    </p>
                    <p id="auth-error" class="error"></p>
                </div>
            </section>

            <section id="page-tasks" style="display:none">
                <h2>My Tasks</h2>
                <form id="task-form" onsubmit="return handleTaskSubmit(event)">
                    <input type="text" id="task-title" placeholder="Task title" required>
                    <input type="text" id="task-desc" placeholder="Description">
                    <button type="submit">Add Task</button>
                </form>
                <ul id="task-list"></ul>
                <hr style="margin:2rem 0">
                <h2>Profile Settings</h2>
                <form id="profile-form" onsubmit="return handleProfileUpdate(event)" class="auth-form" style="margin:1rem 0;max-width:100%">
                    <h2>Update Profile</h2>
                    <input type="email" id="profile-email" placeholder="New email (leave blank to keep)">
                    <input type="password" id="profile-old-pw" placeholder="Current password">
                    <input type="password" id="profile-new-pw" placeholder="New password (leave blank to keep)">
                    <button type="submit">Save Changes</button>
                    <p id="profile-error" class="error"></p>
                </form>
            </section>

            <section id="page-admin" style="display:none">
                <h2>Admin Panel</h2>
                <table id="admin-table">
                    <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="admin-body"></tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
